						document.querySelector(".sp-scan-preview").textContent.includes("فایل خراب است"),
					"a refused read says so, with the server's own Persian reason",
					document.querySelector(".sp-scan-preview").textContent.trim()
				);
				report(
					!preview_button().disabled &&
						!document.querySelector(".sp-logistics-file").disabled &&
						!pending_cells_of("row-1").length,
					"and it restores the controls without staging anything"
				);

				// The read failed before the promise existed, the way a browser refuses a file it cannot
				// read. Nothing may be left disabled and nothing may be left saying it is working.
				await fresh();

				server.throw_once = true;
				document.querySelector(".sp-logistics-file").files = transfer.files;
				preview_button().dispatchEvent(new MouseEvent("click", { bubbles: true }));
				await new Promise((resolve) => window.setTimeout(resolve, 300));

				report(
					!preview_button().disabled && server.previews_in_flight === 0,
					"a read that never left leaves no control disabled and no flag set",
					`disabled: ${preview_button().disabled}, in flight: ${server.previews_in_flight}`
				);

				server.file_fail = null;
				server.file_delay_ms = 0;
				server.file = null;
				server.throw_once = false;
				await fresh();

				// --- the model name: one line, truncating its start, whole in the tooltip --------
				// A Hikvision model is long and its **end** is what tells two of them apart, so the
				// column shows one line and clips the beginning. `getClientRects()` counts the line
				// boxes a box actually produced, which is the measurement that says "one line" rather
				// than a stylesheet that says `nowrap`.
				await fresh_rows([
					{
						row_key: "row-1",
						row_index: 1,
						item_code: "PR89887",
						model: "DS-2CD2347G2-LU (2.8mm) — دوربین بولت ۴ مگاپیکسل با لنز ثابت و دید در شب",
						capacity: 2,
						serial_required: true,
						serials: [],
					},
					{
						row_key: "row-2",
						row_index: 2,
						item_code: "PR89888",
						model: "DS-2CD2347G2-LU 4MP bullet camera, fixed lens (2.8mm)",
						capacity: 2,
						serial_required: true,
						serials: [],
					},
				]);

				const title = column_of("row-1").querySelector(".sp-scan-title");
				const style = window.getComputedStyle(title);

				report(
					title.getClientRects().length === 1,
					"a long model name is drawn on one line, whatever its length",
					`line boxes: ${title.getClientRects().length}`
				);
				report(
					style.whiteSpace === "nowrap" && style.overflow === "hidden",
					"the name is not allowed to wrap",
					`white-space: ${style.whiteSpace}, overflow: ${style.overflow}`
				);
				report(
					style.textOverflow === "ellipsis" && style.direction === "rtl",
					"and it truncates at the side that keeps the end of the name",
					`text-overflow: ${style.textOverflow}, direction: ${style.direction}`
				);
				report(
					title.scrollWidth > title.clientWidth,
					"the name is longer than the space, so the truncation is engaged",
					`${title.scrollWidth} > ${title.clientWidth}`
				);
				report(
					(title.getAttribute("title") || "").startsWith("DS-2CD2347G2-LU"),
					"and the whole name is available in the tooltip",
					title.getAttribute("title")
				);
				report(
					column_of("row-2").querySelector(".sp-scan-title").getClientRects().length === 1,
					"and a name that fits is on one line too"
				);

				// Which characters the browser actually paints, measured on an element that is given a
				// width of its own. The dialog's columns are as wide as the window the app has, and a
				// window the app has hidden gives them none — so this measures the CSS on a controlled
				// box instead, where the answer does not depend on how the pane happens to be sized.
				// Each character gets a `Range`; a character whose rectangle lies entirely right of the
				// box is a character the box has cut away. That is the truncation itself, on the side it
				// happens on, which no stylesheet assertion can promise.
				const sides = (text, width) => {
					const probe = document.createElement("div");

					probe.setAttribute("class", "sp-scan-title");
					probe.setAttribute("style", `width: ${width}px; display: block;`);
					probe.textContent = text;
					document.body.appendChild(probe);

					const frame = probe.getBoundingClientRect();
					const node = probe.firstChild;
					const answer = { drawn: [], before: 0, after: 0, boxes: probe.getClientRects().length };

					for (let index = 0; index < node.length; index += 1) {
						const range = document.createRange();

						range.setStart(node, index);
						range.setEnd(node, index + 1);

						const rect = range.getBoundingClientRect();

						if (!rect.width) {
							continue;
						}

						if (rect.right <= frame.left + 0.5) {
							answer.before += 1;
						} else if (rect.left >= frame.right - 0.5) {
							answer.after += 1;
						} else {
							answer.drawn.push(index);
						}
					}

					probe.remove();

					return answer;
				};

				const LATIN = "DS-2CD2347G2-LU 4MP bullet camera, fixed lens (2.8mm)";
				const cut = sides(LATIN, 120);

				report(
					cut.before > 0 && cut.after === 0,
					"a name too long for its column loses its beginning and keeps its end",
					`cut before: ${cut.before}, after: ${cut.after} of ${LATIN.length}`
				);
				report(
					cut.drawn[cut.drawn.length - 1] === LATIN.length - 1,
					"the last character of the name is still painted",
					`last painted: ${cut.drawn[cut.drawn.length - 1]} of ${LATIN.length - 1}`
				);
				report(
					LATIN.slice(cut.drawn[0]).endsWith("(2.8mm)"),
					"so the lens size at the very end of it survives whole",
					LATIN.slice(cut.drawn[0] || 0)
				);
				report(
					cut.drawn.length > 0 && cut.drawn[0] > 0,
					"and what is painted starts partway into the name",
					`first painted: ${cut.drawn[0]}`
				);
				report(cut.boxes === 1, "on one line", `line boxes: ${cut.boxes}`);


				// --- what a column's heading is made of -----------------------------------------
				report(
					pending_cells_of("row-1").length === 0,
					"and the heading changes nothing about what is staged"
				);

				// --- the window recovers when a call fails before it becomes a promise ----------
				// The shape of the fault that left «در حال ثبت…» on screen for ever: a call that
				// throws synchronously, so the caller's `finally` never had a promise to attach to.
				// The window has to be usable again afterwards, with what was staged still there.
				const before = pending_cells_of("row-1").length;

				report(before === 0, "the recovery scenario starts from an empty window");

				scan("row-1", "R-1");
				await run_after_a_tick();

				const progress = () => document.querySelector(".sp-scan-progress");

				// A file has to be chosen, or the window refuses the click itself and never reaches
				// the server — which would leave the failure this scenario is about untested.
				server.file = { incoming: { "row-1": ["N-1"] } };
				document.querySelector(".sp-logistics-file").files = transfer.files;
				server.throw_once = true;

				preview_button().dispatchEvent(new MouseEvent("click", { bubbles: true }));
				await new Promise((resolve) => window.setTimeout(resolve, 300));

				report(
					server.calls.filter((call) => call.method === "prepare_import_preview").length === 1,
					"the preview request was made, and it is the one that failed",
					`previews attempted: ${server.calls.filter((call) => call.method === "prepare_import_preview").length}`
				);
				report(
					progress().classList.contains("is-hidden"),
					"a call that throws before returning a promise leaves no «در حال ثبت…» behind",
					progress().className
				);
				report(
					!save_button().disabled,
					"and the Save action is usable again",
					save_button().disabled ? "disabled" : "enabled"
				);
				report(
					pending_cells_of("row-1").length === 1,
					"with everything that was staged still staged",
					`row-1 pending: ${pending_cells_of("row-1").length}`
				);

				save_button().dispatchEvent(new MouseEvent("click", { bubbles: true }));
				await new Promise((resolve) => window.setTimeout(resolve, 300));

				report(
					server.writes.join(",") === "R-1",
					"and a save after it writes the staged label",
					server.writes.join(",")
				);
				report(
					progress().classList.contains("is-hidden"),
					"and the window is idle again after a completed save",
					progress().className
				);

				await fresh();


				// --- a scanner that sends no terminator ------------------------------------------
				// Two labels, one after the other, with the first one never ended by Enter or Tab —
				// which is how a wedge configured without a suffix behaves. The second label must
				// not be appended to the first: that is the report this measures.
				await fresh();

				const wedge_types = (row_key, text) => {
					const input = input_of(row_key);

					input.focus();

					for (const character of text) {
						input.value = `${input.value}${character}`;
						input.dispatchEvent(new Event("input", { bubbles: true }));
					}
				};

				wedge_types("row-2", "TERM1");
				await new Promise((resolve) => window.setTimeout(resolve, 400));
				wedge_types("row-2", "TERM2");
				await new Promise((resolve) => window.setTimeout(resolve, 400));

				report(
					pending_cells_of("row-2").length === 2,
					"a scanner with no terminator still gets one label per scan",
					`cells: ${pending_cells_of("row-2").length}, box: ${JSON.stringify(input_of("row-2").value)}`
				);
				const filed = [...pending_cells_of("row-2")].map((cell) =>
					cell.querySelector(".sp-scan-serial").textContent.trim()
				);

				report(
					filed.join(",") === "TERM1,TERM2",
					"and no two labels are concatenated into one",
					`filed: ${filed.join(" | ")}`
				);

				// --- a hand-typed serial is not split by the same fallback -----------------------
				await fresh();

				const typed = "W-12345";

				for (const character of typed) {
					const input = input_of("row-2");

					input.focus();
					input.value = `${input.value}${character}`;
					input.dispatchEvent(new Event("input", { bubbles: true }));
					await new Promise((resolve) => window.setTimeout(resolve, 90));
				}

				await new Promise((resolve) => window.setTimeout(resolve, 400));

				report(
					pending_cells_of("row-2").length === 0,
					"a serial typed by hand at human speed is not filed behind the operator's back",
					`cells: ${pending_cells_of("row-2").length}`
				);
				report(
					input_of("row-2").value === typed,
					"and it is left whole and untouched in the box, for the operator to end themselves",
					`box: ${JSON.stringify(input_of("row-2").value)}`
				);

				// --- a composition event is not a scan -------------------------------------------
				await fresh();

				const composing = input_of("row-2");

				composing.focus();
				composing.value = "شا";
				composing.dispatchEvent(
					new KeyboardEvent("keydown", {
						key: "Enter",
						bubbles: true,
						cancelable: true,
						isComposing: true,
					})
				);
				await run_after_a_tick();

				report(
					pending_cells_of("row-2").length === 0,
					"an Enter that ends an IME composition is not taken as the end of a scan"
				);
				report(
					input_of("row-2").value === "شا",
					"and the half-composed text is left in the box",
					JSON.stringify(input_of("row-2").value)
				);

				// --- what saving a column costs --------------------------------------------------
				// The per-label save this replaced sent one request per scan and redrew the column
				// after each answer. The measurement that matters is not the round trip — this
				// server answers in 8 ms on purpose — but the number of requests and redraws a
				// column's save is made of.
				await fresh_rows([
					{
						row_key: "row-1",
						row_index: 1,
						item_code: "PR89889",
						model: "SIXTY-UNIT ROW",
						capacity: 60,
						serial_required: true,
						serials: [],
					},
				]);

				for (let n = 1; n <= 40; n += 1) {
					scan("row-1", `M-${n}`);
				}

				await run_after_a_tick();

				const save_started = window.performance.now();

				save_button().dispatchEvent(new MouseEvent("click", { bubbles: true }));

				// Measured to the moment the column is empty of unsaved scans — the end of the save
				// as the operator experiences it — rather than over a fixed wait, which would
				// measure the wait.
				for (let wait = 0; wait < 500; wait += 2) {
					if (pending_cells_of("row-1").length === 0) {
						break;
					}

					await new Promise((resolve) => window.setTimeout(resolve, 2));
				}

				const save_elapsed = window.performance.now() - save_started;
				const batches = server.calls.filter((call) => call.method === "add_row_serials");
				const singles = server.calls.filter((call) => call.method === "add_row_serial");

				report(batches.length === 1 && singles.length === 0, "forty scans save as one request", `batches: ${batches.length}, singles: ${singles.length}`);
				report(server.writes.length === 40, "and all forty are written", `writes: ${server.writes.length}`);
				report(
					JSON.parse(batches[0].args.serials).join(",") ===
						Array.from({ length: 40 }, (_, index) => `M-${index + 1}`).join(","),
					"sending the labels in the order they were scanned, whole"
				);
				report(
					true,
					`saving forty labels took ${save_elapsed.toFixed(0)} ms: one request, one redraw${timing_context()}`
				);

				// --- what one scan costs ---------------------------------------------------------
				await fresh();

				const scans = 200;

				for (let n = 1; n <= 40; n += 1) {
					scan("row-1", `B-${n}`);
				}

				await new Promise((resolve) => window.setTimeout(resolve, 400));

				const started = window.performance.now();

				for (let n = 41; n <= scans; n += 1) {
					scan("row-1", `B-${n}`);
				}

				const elapsed = window.performance.now() - started;

				report(
					true,
					`${scans - 40} scans into one column took ${elapsed.toFixed(0)} ms (${(
						elapsed /
						(scans - 40)
					).toFixed(2)} ms each), timed after the page was allowed to settle${timing_context()}`,
					`cells in that column: ${cells_of("row-1").length}`
				);

				const late = await measure_scans("L");

				report(
					true,
					`the same ${120 - 20}-scan loop costs ${early} ms each at the start of this run and ${late} ms each at the end${timing_context()}`
				);

				// --- the transfer window -----------------------------------------------------------
				// The second button on a Sales Invoice, and the half a source text cannot check: that
				// a press opens a table, that the table is the server's own list in the server's own
				// order, that ticking an acknowledgment asks the server again rather than promoting
				// the row by itself, and that what the apply sends is the selection the screen showed.
				const transfer_buttons = [];
				const reloads = [];
				const transfer_frm = {
					doc: {
						name: "HARNESS-SINV-0002",
						docstatus: 1,
						company: "SP TEST COMPANY",
						amended_from: "HARNESS-SINV-0001",
					},
					reload_doc: () => reloads.push(1),
					add_custom_button: (label, action, group) =>
						transfer_buttons.push({ label: label, action: action, group: group }),
				};
				const transfer_hook = FORM_HANDLERS["Sales Invoice"][1];

				report(Boolean(transfer_hook && transfer_hook.refresh), "the page captured the transfer hook too");

				await transfer_hook.refresh(transfer_frm);
				await run_after_a_tick();

				report(
					transfer_buttons.length === 1 && transfer_buttons[0].label === "انتقال سریال",
					"an amended invoice adds one «انتقال سریال» button",
					`buttons: ${transfer_buttons.map((button) => button.label).join(" | ") || "—"}`
				);
				report(
					transfer_buttons[0].group === undefined,
					"and it is a plain button rather than an entry inside a dropdown"
				);

				$("#pane").empty();
				server.transfers.length = 0;
				transfer_buttons[0].action();
				await new Promise((resolve) => window.setTimeout(resolve, 200));

				const transfer_rows = () => Array.from(document.querySelectorAll(".sp-transfer-table tbody tr"));
				const transfer_cell = (row, index) => row.children[index].textContent.trim();

				report(
					transfer_rows().length === 6,
					"one press opens a table with one row per serial the cancelled invoice holds",
					`rows: ${transfer_rows().length}`
				);
				report(
					transfer_rows().map((row) => transfer_cell(row, 1)).join(",") === "A-1,A-2,A-3,A-4,A-5,A-6",
					"in the server's own order, not grouped by outcome",
					transfer_rows().map((row) => transfer_cell(row, 1)).join(",")
				);
				report(
					document.querySelectorAll(".sp-transfer-status.is-ok").length === 4 &&
						document.querySelectorAll(".sp-transfer-status.is-warning").length === 1 &&
						document.querySelectorAll(".sp-transfer-status.is-blocked").length === 1,
					"four moving, one needing an answer, one with nowhere to go",
					`ok: ${document.querySelectorAll(".sp-transfer-status.is-ok").length}, warning: ${
						document.querySelectorAll(".sp-transfer-status.is-warning").length
					}, blocked: ${document.querySelectorAll(".sp-transfer-status.is-blocked").length}`
				);
				report(
					transfer_cell(transfer_rows()[3], 3).indexOf("تأیید") >= 0,
					"the serial that needs an answer says so in its own cell"
				);
				report(
					document.querySelectorAll(".sp-transfer-ack").length === 1 &&
						document.querySelectorAll(".sp-transfer-pick").length === 4,
					"and it is the only row offered an acknowledgment, beside the four that can move",
					`acks: ${document.querySelectorAll(".sp-transfer-ack").length}, picks: ${document.querySelectorAll(".sp-transfer-pick").length}`
				);
				report(
					document.querySelectorAll(".sp-transfer-table tbody tr")[4].querySelector(
						".sp-transfer-pick, .sp-transfer-ack"
					) === null,
					"while the row with nowhere to go is offered nothing to change"
				);
				report(
					document.querySelectorAll(".sp-transfer-row-select").length === 4,
					"a row of an item with more than one place to go gets a select",
					`selects: ${document.querySelectorAll(".sp-transfer-row-select").length}`
				);
				report(
					document.querySelector(".sp-transfer-table").textContent.indexOf("A-1") >= 0 &&
						document.querySelectorAll(".sp-transfer-table td[dir='ltr']").length > 0,
					"the serials are drawn left to right whatever the form's direction"
				);
				report(
					document.querySelector(".sp-transfer-toolbar").textContent.indexOf("HARNESS-SINV-0001") >= 0,
					"and the cancelled invoice is named at the top of the window"
				);

				// The acknowledgment is a question, so the answer goes to the server and comes back
				// as an outcome: the row must stop saying it needs an answer.
				const transfer_calls = () =>
					server.calls.filter((call) => call.method === "preview_serial_transfer").length;

				const before_ack = transfer_calls();

				$(".sp-transfer-ack").prop("checked", true).trigger("change");
				await new Promise((resolve) => window.setTimeout(resolve, 200));

				report(
					transfer_calls() === before_ack + 1,
					"ticking an acknowledgment asks the server again rather than deciding by itself",
					`calls: ${before_ack} → ${transfer_calls()}`
				);
				report(
					document.querySelectorAll(".sp-transfer-status.is-ok").length === 5 &&
						document.querySelectorAll(".sp-transfer-status.is-warning").length === 0,
					"and the row stops saying it needs an answer",
					`ok: ${document.querySelectorAll(".sp-transfer-status.is-ok").length}, warning: ${
						document.querySelectorAll(".sp-transfer-status.is-warning").length
					}`
				);
				report(
					transfer_cell(transfer_rows()[3], 3).indexOf("تأییدشده") >= 0,
					"and reads as a move the operator confirmed",
					transfer_cell(transfer_rows()[3], 3)
				);

				// Un-ticking a serial is the operator saying it stays where it is, and the row keeps
				// the box that took it out — so the tick is reversible without closing the window.
				$(".sp-transfer-pick").first().prop("checked", false).trigger("change");
				await new Promise((resolve) => window.setTimeout(resolve, 200));

				report(
					transfer_cell(transfer_rows()[0], 3).indexOf("انتخاب نشده") >= 0,
					"un-ticking a serial says it is not being asked for",
					transfer_cell(transfer_rows()[0], 3)
				);
				report(
					transfer_rows()[0].querySelector(".sp-transfer-pick") !== null,
					"and the row keeps the box, so the answer can be taken back"
				);

				$(".sp-transfer-pick").first().prop("checked", true).trigger("change");
				await new Promise((resolve) => window.setTimeout(resolve, 200));

				report(
					transfer_rows().filter((row) => row.querySelector(".sp-transfer-pick:checked")).length === 5,
					"and taking it back puts all five movable serials back in the selection",
					`ticked: ${transfer_rows().filter((row) => row.querySelector(".sp-transfer-pick:checked")).length}`
				);

				// The press itself. `frappe.confirm` in this page answers yes, because the tests are
				// about what happens after the operator agreed.
				const open_dialog = DIALOGS[DIALOGS.length - 1];

				open_dialog.options.primary_action();
				await new Promise((resolve) => window.setTimeout(resolve, 200));

				report(server.transfers.length === 1, "confirming sends exactly one apply", `applies: ${server.transfers.length}`);
				report(
					server.transfers[0].serials.join(",") === "A-1,A-2,A-3,A-4,A-5,A-6",
					"naming the serials the table showed as moving",
					server.transfers[0].serials.join(",")
				);
				report(
					server.transfers[0].acknowledged.join(",") === "A-4",
					"carrying the acknowledgment the operator gave",
					server.transfers[0].acknowledged.join(",")
				);
				report(
					Boolean(server.transfers[0].token),
					"and the token the preview it was looking at returned"
				);
				report(reloads.length === 1, "and the form is reloaded so the columns show the new rows");
				report(
					shown.some((payload) => /LST-2026-00001/.test(String(payload.message || ""))),
					"the record's name is shown in the result"
				);

				// --- a refusal, and the retry it has to leave possible --------------------------
				// What the window owns when the server says no. It does not swallow the refusal,
				// it does not reload a form whose serials did not move, and it does not offer the
				// same stale request again — a refusal is exactly what a stale token produces, so
				// it asks for a fresh preview and leaves the operator where they were.
				//
				// The sentence itself is shown by Frappe: `frappe.call` renders `_server_messages`
				// for every refused request, which is why the window's own catch has nothing to say
				// and why nothing here asserts that it does. The harness's stand-in for `frappe.call`
				// is not that renderer, so what is asserted is the window's half of the exchange.
				// Counted from the calls rather than from `server.previews`: that counter belongs to
				// the workbook preview, and the transfer preview is a different endpoint.
				const transfer_previews = () =>
					server.calls.filter((call) => call.method === "preview_serial_transfer").length;

				const previews_before_refusal = transfer_previews();
				const reloads_before_refusal = reloads.length;
				const applies_before_refusal = server.transfers.length;

				server.transfer_fail_with =
					"درخواست دیگری هم‌زمان روی همین سند در حال ثبت بود. چیزی ثبت نشد؛ لطفاً دوباره تلاش کنید.";

				// A **fresh** dialog: the one the success above came from was hidden, and hiding it
				// forgets the preview it was holding (`state.preview = null` in its `onhide`), so a
				// press on that dialog would be refused by the window's own guard and nothing would
				// reach the server. The refusal has to be the first press of a dialog whose preview
				// is live — which is also the situation an operator is actually in.
				transfer_buttons[0].action();
				await new Promise((resolve) => window.setTimeout(resolve, 250));

				const refused_dialog = DIALOGS[DIALOGS.length - 1];

				refused_dialog.options.primary_action();
				await new Promise((resolve) => window.setTimeout(resolve, 250));

				report(
					server.transfers.length === applies_before_refusal,
					"a refused apply registers nothing",
					`applies ${applies_before_refusal} → ${server.transfers.length}`
				);
				report(
					transfer_previews() > previews_before_refusal,
					"and the window asks for a fresh preview rather than repeating a stale request",
					`previews ${previews_before_refusal} → ${transfer_previews()}`
				);
				report(
					reloads.length === reloads_before_refusal,
					"the form is not reloaded over a refusal that moved nothing",
					`reloads ${reloads_before_refusal} → ${reloads.length}`
				);
				report(
					refused_dialog.$wrapper.find(".sp-transfer-table tbody tr").length > 0,
					"the table is still there, so the operator has not lost what they were reviewing"
				);
				// Busy is the only state this page can see: Desk's own footer button is not part of
				// the dialog this harness builds, so whether it is enabled is asserted by the retry
				// below instead — a button that stayed disabled could not send a second apply.
				report(
					refused_dialog.$wrapper.find(".sp-transfer-toolbar").hasClass("is-busy") === false,
					"and it is no longer busy, so the operator can press again"
				);

				// The retry itself: the same press, with the server answering this time.
				server.transfer_fail_with = "";

				DIALOGS[DIALOGS.length - 1].options.primary_action();
				await new Promise((resolve) => window.setTimeout(resolve, 250));

				report(
					server.transfers.length === applies_before_refusal + 1,
					"pressing again sends the apply a second time",
					`applies ${server.transfers.length}`
				);
				report(
					reloads.length === reloads_before_refusal + 1,
					"and a retry that succeeds reloads the form",
					`reloads ${reloads.length}`
				);

				// An invoice that is not an amendment has nothing to transfer from.
				transfer_buttons.length = 0;
				await transfer_hook.refresh({
					...transfer_frm,
					doc: { ...transfer_frm.doc, amended_from: "" },
				});
				await run_after_a_tick();

				report(transfer_buttons.length === 0, "an invoice that is not an amendment gets no button");

				transfer_buttons.length = 0;
				await transfer_hook.refresh({ ...transfer_frm, doc: { ...transfer_frm.doc, docstatus: 2 } });
				await run_after_a_tick();

				report(transfer_buttons.length === 0, "and neither does a cancelled one");

				// --- the render the tests above left behind --------------------------------------
				await fresh();
				scan("row-2", "P-1");
				scan("row-2", "P-2");
				scan("row-2", "P-3");
				await run_after_a_tick();
			};

			const render = () => {
				const bar = document.getElementById("results");

				if (!bar) {
					return;
				}

				const failed = results.filter((row) => row.startsWith("FAIL")).length;

				bar.textContent = `${results.join("\n")}\n\n${
					failed ? `FAIL (${failed} of ${results.length})` : `PASS (${results.length} checks)`
				}`;

				bar.style.borderColor = failed ? "#e03636" : "#29cd42";
				window.harness_results = results;
			};

			// A scenario that throws is a result too — the one that matters most — so it is reported
			// like any other failure instead of leaving the page on "running…" with no reason given.
			run()
				.catch((error) => {
					results.push(`FAIL the harness stopped: ${(error && error.message) || error}`);
				})
				.then(render);
		</script>
	</body>
</html>
