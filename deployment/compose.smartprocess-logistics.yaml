# Optional Docker wiring for this app. The application itself never reads this file, and it
# contains no site name, port or container name of its own.
#
# How it attaches the app to an existing frappe_docker stack:
#
#   1. The repository is bind-mounted at the bench's `apps/` directory, so the code is present
#      in every service.
#   2. `smartprocess_logistics.pth` is bind-mounted into the environment's `site-packages`,
#      which puts the app on `sys.path` for every Python service.
#
# Why a `.pth` file instead of `PYTHONPATH`: a Compose `environment:` entry replaces the
# variable instead of appending to it. This stack already sets `PYTHONPATH` on `backend`,
# `queue-short`, `queue-long` and `scheduler` to the path list of five other apps, so setting
# it here would silently drop those imports. The `.pth` file adds one path without touching
# the variable. `site-packages` lives in the image rather than on a volume, so the mount is
# re-created from this file on every container recreate.
#
# Required environment variable, set in the stack's `.env`:
#
#   SMARTPROCESS_LOGISTICS_APP_PATH=<absolute path to this repository>
#
# List this file after the others, and start only what is needed:
#
#   docker compose -p <project> -f compose.yaml ... \
#     -f <repo>/deployment/compose.smartprocess-logistics.yaml up -d --dry-run
#
# Verify with `docker compose ... config` before `up`. A run without this file reports the
# mounted app as absent; it does not remove anything.
#
# Rollback: bring the stack up again without this file, or drop these two volumes.
#
# This file intentionally does not mention the `backend-ptm-test` or `frontend-ptm-test`
# services. They serve a different site and this app is not wired into them.

x-logistics-app: &logistics-app
  type: bind
  source: ${SMARTPROCESS_LOGISTICS_APP_PATH}
  target: /home/frappe/frappe-bench/apps/smartprocess_logistics
  # Read-only, like the `.pth` and the assets below. `bench install-app` writes nothing into
  # the app directory: `sync_for` reads the DocType JSONs and inserts them into the database,
  # and the three export paths that would write back into an app folder are all suppressed
  # while `frappe.flags.in_import` is set, which `import_doc` sets around every DocType it
  # inserts. Keeping this writable would let a Desk-side save of a standard DocType write a
  # controller and a JSON straight into the working copy.
  #
  # What this costs, measured on a site with `developer_mode` on: saving a standard document
  # this app ships — a workspace, a workspace sidebar, a desktop icon — makes the framework
  # export the JSON back into this directory and fails with `Errno 30 Read-only file system`.
  # A workspace or icon an administrator created themselves (`standard: 0`) saves normally,
  # because nothing is exported for it. Make this writable for a development stack, and leave
  # it read-only where the app's own navigation is shipped rather than edited.
  read_only: true

x-logistics-pth: &logistics-pth
  type: bind
  source: ${SMARTPROCESS_LOGISTICS_APP_PATH}/deployment/smartprocess_logistics.pth
  target: /home/frappe/frappe-bench/env/lib/python3.14/site-packages/smartprocess_logistics.pth
  read_only: true

# `/assets/<app>/...` is served from `sites/assets/<app>`, and in this stack `sites/assets`
# is a symlink to `bench/assets` — so mounting the app's `public` directory at
# `bench/assets/<app>` is what makes `app_include_css` resolve. Measured: the app's CSS is
# served from `/assets/smartprocess_logistics/css/logistics.css` with this in place.
x-logistics-assets: &logistics-assets
  type: bind
  source: ${SMARTPROCESS_LOGISTICS_APP_PATH}/smartprocess_logistics/public
  target: /home/frappe/frappe-bench/assets/smartprocess_logistics
  read_only: true

# The compiled Persian catalogue, mounted as a single file rather than compiled inside the
# container. `bench build --app` writes `sites/assets/locale/<lang>/LC_MESSAGES/<app>.mo`, and
# in this stack `sites/assets` is the symlink above, which resolves into `bench/assets` — image
# content, not the `sites` volume. A catalogue compiled at runtime is therefore erased by the
# next container recreate, and the Persian module label silently reverts to English. Shipping
# the `.mo` in the app and binding it here makes the label survive a recreate.
#
# Mounting the file, not a directory: `assets/locale/fa/LC_MESSAGES/` also holds `frappe.mo`
# and `erpnext.mo`, and a directory mount would hide them and break Persian site-wide.
#
# Backend only: the Desk fetches translations through the backend API (`get_all_translations`),
# and the catalogue holds the module label, which nothing in a background job renders. An entry
# added later for text that emails or reports render belongs on the workers too.
x-logistics-catalogue: &logistics-catalogue
  type: bind
  source: ${SMARTPROCESS_LOGISTICS_APP_PATH}/smartprocess_logistics/locale/fa/LC_MESSAGES/smartprocess_logistics.mo
  target: /home/frappe/frappe-bench/assets/locale/fa/LC_MESSAGES/smartprocess_logistics.mo
  read_only: true

services:
  configurator:
    volumes:
      - *logistics-app
      - *logistics-pth

  backend:
    volumes:
      - *logistics-app
      - *logistics-pth
      - *logistics-catalogue

  frontend:
    volumes:
      - *logistics-app
      - *logistics-pth
      - *logistics-assets

  websocket:
    volumes:
      - *logistics-app
      - *logistics-pth

  queue-short:
    volumes:
      - *logistics-app
      - *logistics-pth

  queue-long:
    volumes:
      - *logistics-app
      - *logistics-pth

  scheduler:
    volumes:
      - *logistics-app
      - *logistics-pth
